<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/velora_favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velora | Luxury Fashion & Accessories</title>
  </head>
  <body>
    <div id="root">
      <style>
        .velora-preloader {
          height: 100vh;
          display: flex;
          align-items: center;
          justify-content: center;
          background-color: #ffffff;
          color: #111111;
          font-family: 'Playfair Display', serif;
          font-size: 2.5rem;
          letter-spacing: 0.2em;
          text-transform: uppercase;
          animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
          0%, 100% { opacity: 1; }
          50% { opacity: 0.3; }
        }
      </style>
      <div class="velora-preloader">VELORA</div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
